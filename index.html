<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>คำนวณ 60/40 + เพดาน 200</title>

<style>
body{
    font-family:sans-serif;
    max-width:500px;
    margin:auto;
    padding:20px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    font-size:16px;
}

button{
    background:#2196F3;
    color:white;
    border:none;
    cursor:pointer;
}

.result{
    margin-top:15px;
    background:#f1f8e9;
    padding:15px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="card">

<h2>🛒 คำนวณ 60/40 (มีเพดาน 200 บาท)</h2>

<input type="number" id="price" placeholder="กรอกราคาสินค้า">

<button onclick="calc()">คำนวณ</button>

<div class="result" id="result"></div>

</div>

<script>
function calc(){

    let price = Number(document.getElementById("price").value);

    if(price <= 0){
        document.getElementById("result").innerHTML = "กรุณากรอกราคา";
        return;
    }

    // คำนวณ 60/40
    let gov = price * 0.60;
    let user = price * 0.40;

    // เพดานรัฐ 200 บาท
    let govUsed = gov;
    let cashExtra = 0;

    if(gov > 200){
        govUsed = 200;
        cashExtra = gov - 200;
    }

    // เงินที่ต้องจ่ายจริง (สแกน)
    let scanPay = user + cashExtra;

    document.getElementById("result").innerHTML = `
        <h3>📊 ผลลัพธ์</h3>
        <p>ราคาสินค้า: ${price.toFixed(2)} บาท</p>
        <p>รัฐช่วย: ${govUsed.toFixed(2)} บาท</p>
        <p>ต้องจ่ายปกติ (40%): ${user.toFixed(2)} บาท</p>
        <p><b>💳 ต้องสแกนจ่ายจริง: ${scanPay.toFixed(2)} บาท</b></p>
        <p style="color:red;">(ถ้าเกินเพดาน 200 บาท จะต้องจ่ายเพิ่มเป็นเงินสดในระบบ)</p>
    `;
}
</script>

</body>
</html>
