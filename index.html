<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>คำนวณยอดร้านค้า</title>

<style>
body{
    font-family:sans-serif;
    max-width:500px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:14px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    font-size:16px;
}

button{
    background:#2196F3;
    color:white;
    border:none;
    border-radius:8px;
}

.result{
    margin-top:15px;
    padding:15px;
    background:#e8f5e9;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="card">

<h2>🛒 คำนวณยอดร้านค้า</h2>

<input type="number" id="price" placeholder="กรอกราคาสินค้า">

<button onclick="calc()">คำนวณ</button>

<div class="result" id="result"></div>

</div>

<script>
function calc(){

    let price = Number(document.getElementById("price").value);

    if(price <= 0){
        document.getElementById("result").innerHTML = "กรุณากรอกราคา";
        return;
    }

    let shopSupport = price * 0.60;  // ส่วนลดระบบร้าน
    let customerPay = price * 0.40;  // ลูกค้าจ่าย

    let supportUsed = shopSupport;
    let cashExtra = 0;

    // เพดาน 200 บาท
    if(shopSupport > 200){
        supportUsed = 200;
        cashExtra = shopSupport - 200;
    }

    let scanPay = customerPay;
    let cashPay = cashExtra;

    document.getElementById("result").innerHTML = `
        <h3>📊 สรุปยอด</h3>

        <p>💰 ราคาสินค้า: ${price.toFixed(2)} บาท</p>

        <p>🏪 ร้านช่วยออก: ${supportUsed.toFixed(2)} บาท</p>

        <p>📱 ลูกค้าต้องสแกนจ่าย: <b>${scanPay.toFixed(2)} บาท</b></p>

        <p>💵 เงินสดเพิ่ม (ถ้าเกินเพดาน): <b>${cashPay.toFixed(2)} บาท</b></p>
    `;
}
</script>

</body>
</html>
